name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frontend and settings
        run: |
          node --check main.js
          node --check joypad-input.js
          node tools/test-joypad-input.mjs
          node tools/test-snes-config.mjs
      - name: Check scripts and XML
        run: |
          python -m py_compile rom_server.py tools/preview_server.py
          python -c 'import xml.etree.ElementTree as ET; ET.parse("config.xml")'
          bash -n tools/*.sh
